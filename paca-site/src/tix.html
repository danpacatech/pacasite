<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PACA Seat Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=Fraunces:ital,wght@0,500;0,600;1,500&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EDE0;
    --ink:#2B0B3E;
    --accent:#ED2375;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#e7e2d6;
    font-family:'Barlow Condensed', sans-serif;
    color:var(--ink);
  }

  /* ---------- control panel (screen only) ---------- */
  #panel{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  #panel h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:28px;
    letter-spacing:0.02em;
    margin:0 0 4px;
  }
  #panel p.sub{
    margin:0 0 24px;
    font-size:16px;
    opacity:0.75;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
  }
  .row{
    display:flex;
    gap:16px;
  }
  .row .field{flex:1;}
  input[type=text], textarea, select{
    width:100%;
    font-family:'Spline Sans Mono', monospace;
    font-size:13px;
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
  }
  textarea{
    min-height:110px;
    resize:vertical;
  }
  input[type=file]{
    font-family:'Barlow Condensed', sans-serif;
    font-size:14px;
  }
  .file-drop{
    border:1.5px dashed #999;
    border-radius:6px;
    padding:14px;
    background:#fff;
  }
  #status{
    font-size:13px;
    margin-top:8px;
    min-height:18px;
  }
  #status.err{color:#b3261e;}
  #status.ok{color:#1e6b3a;}
  button{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.02em;
    padding:11px 22px;
    border-radius:4px;
    border:none;
    cursor:pointer;
  }
  #generateBtn{
    background:var(--ink);
    color:var(--paper);
    margin-top:8px;
  }
  #printBtn{
    background:var(--accent);
    color:#fff;
    margin-left:10px;
  }
  #generateBtn:disabled{
    background:#999;
    cursor:not-allowed;
  }
  .count-note{
    font-size:13px;
    opacity:0.7;
    margin-top:10px;
  }
  hr.div{
    border:none;
    border-top:1px solid #d8d2c2;
    margin:26px 0;
  }

  /* ---------- ticket sheet ---------- */
  #sheet{
    max-width:900px;
    margin:0 auto;
  }
  .print-page{
    background:var(--paper);
    width:8.1in;
    padding:0.4in;
    margin:0 auto 24px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(8,1fr);
    gap:0.09in;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  .ticket{
    display:flex;
    border:1px dashed var(--ink);
    border-radius:2px;
    overflow:hidden;
    background:transparent;
  }
  .stub{
    width:0.4in;
    border-right:1.5px dashed var(--accent);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:0.05in 0;
  }
  .stub .stub-logo{
    width:0.26in;
    height:0.26in;
    object-fit:contain;
  }
  .stub .stub-num{
    font-family:'Spline Sans Mono', monospace;
    font-size:6.5px;
    color:var(--ink);
    opacity:0.7;
  }
  .body{
    flex:1;
    padding:0.05in 0.09in;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
  }
  .show-line{
    font-family:'Barlow Condensed', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    opacity:0.8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .guest-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:15px;
    line-height:1.1;
    margin:1px 0 3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .seat-row{
    display:flex;
    align-items:baseline;
    gap:5px;
  }
  .seat-label{
    font-family:'Barlow Condensed', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.7;
  }
  .seat-value{
    font-family:'Spline Sans Mono', monospace;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @media print{
    body{background:#fff;}
    #panel{display:none;}
    .print-page{
      box-shadow:none;
      margin:0;
      width:auto;
      padding:0.4in;
      break-after:page;
    }
    .print-page:last-child{break-after:auto;}
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>

<div id="panel">
  <h1>Seat ticket generator</h1>
  <p class="sub">Upload a CSV, map the name and seat columns, then print. 24 tickets per page.</p>

  <div class="row">
    <div class="field">
      <label>Event (required, printed on every ticket)</label>
      <input type="text" id="eventName" placeholder="e.g. The 1904 Olympic Marathon" required>
    </div>
    <div class="field">
      <label>Date (required, printed on every ticket)</label>
      <input type="text" id="eventDate" placeholder="e.g. Oct 17, 2026" required>
    </div>
  </div>
  <div class="count-note" id="eventStatus"></div>

  <div class="field file-drop">
    <label>CSV file</label>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <div class="count-note">Or paste CSV text below instead of uploading.</div>
    <textarea id="csvText" placeholder="Name,Seat&#10;Jane Doe,Row 3 Seat 5&#10;John Smith,Row 3 Seat 6"></textarea>
  </div>

  <div id="status"></div>

  <div class="row" id="mapRow" style="display:none;">
    <div class="field">
      <label>Name column</label>
      <select id="nameCol"></select>
    </div>
    <div class="field">
      <label>Seat column</label>
      <select id="seatCol"></select>
    </div>
  </div>

  <button id="generateBtn" disabled>Generate tickets</button>
  <button id="printBtn" style="display:none;">Print / Save as PDF</button>
  <div class="count-note" id="countNote"></div>
</div>

<hr class="div">

<div id="sheet"></div>

<script>
let parsedRows = [];
let headers = [];

function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim().length>0);
  if(lines.length === 0) return {headers:[], rows:[]};
  const parseLine = (line) => {
    const out = [];
    let cur = '';
    let inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){
        if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(c === ',' && !inQuotes){
        out.push(cur); cur = '';
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  const hdrs = parseLine(lines[0]);
  const rows = lines.slice(1).map(parseLine);
  return {headers: hdrs, rows};
}

function guessColumn(hdrs, keywords){
  const lower = hdrs.map(h => h.toLowerCase());
  for(const kw of keywords){
    const idx = lower.findIndex(h => h.includes(kw));
    if(idx !== -1) return idx;
  }
  return 0;
}

function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = kind || '';
}

function handleCSVLoaded(text){
  const {headers: hdrs, rows} = parseCSV(text);
  if(hdrs.length < 2 || rows.length === 0){
    setStatus('Could not find at least two columns and one data row. Check the CSV.', 'err');
    document.getElementById('mapRow').style.display = 'none';
    document.getElementById('generateBtn').disabled = true;
    return;
  }
  headers = hdrs;
  parsedRows = rows;

  const nameSel = document.getElementById('nameCol');
  const seatSel = document.getElementById('seatCol');
  nameSel.innerHTML = '';
  seatSel.innerHTML = '';
  hdrs.forEach((h, i) => {
    const o1 = document.createElement('option'); o1.value = i; o1.textContent = h || '(column '+(i+1)+')';
    const o2 = document.createElement('option'); o2.value = i; o2.textContent = h || '(column '+(i+1)+')';
    nameSel.appendChild(o1);
    seatSel.appendChild(o2);
  });
  nameSel.value = guessColumn(hdrs, ['name']);
  seatSel.value = guessColumn(hdrs, ['seat']);

  document.getElementById('mapRow').style.display = 'flex';
  document.getElementById('generateBtn').disabled = false;
  setStatus(`Loaded ${rows.length} row${rows.length===1?'':'s'} with ${hdrs.length} columns.`, 'ok');
}

document.getElementById('csvFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    document.getElementById('csvText').value = evt.target.result;
    handleCSVLoaded(evt.target.result);
  };
  reader.onerror = () => setStatus('Could not read that file.', 'err');
  reader.readAsText(file);
});

document.getElementById('csvText').addEventListener('input', (e) => {
  const text = e.target.value;
  if(text.trim().length === 0){
    document.getElementById('mapRow').style.display = 'none';
    document.getElementById('generateBtn').disabled = true;
    setStatus('', '');
    return;
  }
  handleCSVLoaded(text);
});

function checkEventFields(){
  const eventName = document.getElementById('eventName').value.trim();
  const eventDate = document.getElementById('eventDate').value.trim();
  const ok = eventName.length > 0 && eventDate.length > 0;
  document.getElementById('eventStatus').textContent = ok ? '' : 'Event and date are both required before you can generate tickets.';
  document.getElementById('eventStatus').className = ok ? '' : 'err';
  return ok;
}
document.getElementById('eventName').addEventListener('input', checkEventFields);
document.getElementById('eventDate').addEventListener('input', checkEventFields);

document.getElementById('generateBtn').addEventListener('click', () => {
  if(!checkEventFields()){
    return;
  }
  const nameIdx = parseInt(document.getElementById('nameCol').value, 10);
  const seatIdx = parseInt(document.getElementById('seatCol').value, 10);
  const eventName = document.getElementById('eventName').value.trim();
  const eventDate = document.getElementById('eventDate').value.trim();

  const tickets = parsedRows
    .map(r => ({ name: (r[nameIdx]||'').trim(), seat: (r[seatIdx]||'').trim() }))
    .filter(t => t.name || t.seat);

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';

  const perPage = 24;
  for(let p = 0; p < Math.ceil(tickets.length / perPage); p++){
    const page = document.createElement('div');
    page.className = 'print-page';
    const chunk = tickets.slice(p*perPage, p*perPage + perPage);
    chunk.forEach((t, i) => {
      const num = String(p*perPage + i + 1).padStart(3,'0');
      const ticket = document.createElement('div');
      ticket.className = 'ticket';
      ticket.innerHTML = `
