# ── PACA content manager configuration ─────────────────────────
# Editors visit  /admin/  on the live site to add and edit shows.

backend:
  name: git-gateway
  repo: danpacatech/pacasite
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0cf071f2-d976-4ff2-86dc-1721af24a682/pkce
  auth_token_endpoint: /sites/0cf071f2-d976-4ff2-86dc-1721af24a682/token
  gateway_url: https://gateway.decapbridge.com
  # ↓↓↓ Fill these three from your DecapBridge dashboard (decapbridge.com),
  #     then uncomment them, to enable login on the live site.
  # repo: your-username/paca-site
  # identity_url: https://auth.decapbridge.com/sites/YOUR-SITE-ID
  # gateway_url: https://gateway.decapbridge.com

# Lets you test the CMS on your own computer with no login:
#   1) run the site:   npm start
#   2) in another tab: npm run cms   (starts the local editor proxy)
#   3) open:           http://localhost:8080/admin/


media_folder: "paca-site/src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: shows
    label: "Shows & Events"
    label_singular: "Show / Event"
    folder: "paca-site/src/shows"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date_start, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Discipline", name: discipline, widget: select, options: [Theatre, Music, "Visual Art", Prose, Dance, Event, Party, Auditions, Other], default: Theatre }
      - { label: "Feature on the home page", name: featured, widget: boolean, default: false, hint: "Only one at a time. Turning a new one on means turning the old one off." }
      - { label: "Status", name: status, widget: select, options: [upcoming, past], default: upcoming, hint: "Set to past to remove it from What's On and drop it into Past Productions." }
      - { label: "Display date text", name: date_label, widget: string, required: false, hint: "How the dates read on the page, e.g. Jul 10 to 11. Leave blank to show the start date." }
      - { label: "Start (date and time)", name: date_start, widget: datetime, date_format: "YYYY-MM-DD", time_format: "h:mm a", format: "YYYY-MM-DDTHH:mm", picker_utc: false, required: false, hint: "The actual first performance. Drives ordering, the calendar button, and the archive." }
      - { label: "End (date and time, optional)", name: date_end, widget: datetime, date_format: "YYYY-MM-DD", time_format: "h:mm a", format: "YYYY-MM-DDTHH:mm", picker_utc: false, required: false, hint: "Used for the calendar. Defaults to two hours after start." }
      - { label: "Showtime text (optional)", name: showtime, widget: string, required: false, hint: "Friendly time shown on the page, e.g. 7:30 PM." }
      - { label: "Short summary", name: summary, widget: text, required: false, hint: "One or two sentences for the cards." }
      - { label: "Poster image", name: image, widget: image, required: false }
      - { label: "Ticket link (optional)", name: ticket_url, widget: string, required: false, hint: "This event's own ticket page. Leave blank to use the site's default Tickets link." }
      - { label: "Run time (optional)", name: runtime, widget: string, required: false, hint: "e.g. 90 minutes, no intermission" }
      - { label: "Ticket price (optional)", name: price, widget: string, required: false, hint: "e.g. $15 general, $10 students" }
      - { label: "Content note (optional)", name: content_warning, widget: string, required: false }
      - { label: "Cast & creative (optional)", name: credits, widget: text, required: false, hint: "One per line, e.g. Director: ... then Cast: ..." }
      - { label: "Full description", name: body, widget: markdown }
      - { label: "Playbill (PDF, optional)", name: playbill, widget: file, required: false, hint: "Upload the playbill PDF. The link only appears when a file is set." }

  - name: settings
    label: Site Settings
    files:
      - name: contact
        label: "Contact & Links"
        file: "paca-site/src/_data/site.json"
        description: "Address, phone, and the links used across the whole site."
        fields:
          - { label: "Site theme", name: theme, widget: select, default: default, hint: "Recolors the whole site. Save and give it a minute to rebuild.", options: [ { label: "Default", value: default }, { label: "Fall", value: fall }, { label: "Winter", value: winter }, { label: "Summer", value: summer }, { label: "Pride", value: pride }, { label: "Halloween", value: halloween }, { label: "Cabaret", value: cabaret }, { label: "Bad Auditions", value: bad-auditions }, { label: "Attack of the PACA", value: attack }, { label: "Uncle Vanya", value: vanya }, { label: "The Irish", value: irish }, { label: "The Goat", value: goat }, { label: "Mean Girls", value: meangirls }, { label: "Who's Holiday", value: "whos-holiday" } ] }
          - { label: "Short name", name: name, widget: string }
          - { label: "Full name", name: fullName, widget: string }
          - { label: "Address", name: address, widget: string }
          - { label: "Phone (display)", name: phone, widget: string }
          - { label: "Phone (tel: link)", name: phoneHref, widget: string }
          - { label: "Website URL", name: url, widget: string }
          - { label: "Tickets URL (Eventbrite)", name: tickets, widget: string }
          - { label: "Donate URL", name: donate, widget: string }
          - { label: "Instagram URL", name: instagram, widget: string }
          - { label: "Facebook URL", name: facebook, widget: string }
          - { label: "Merch URL (Square)", name: merch, widget: string, required: false, hint: "Square Online store link. Leave blank to fall back to the merch email." }
          - { label: "YouTube URL", name: youtube, widget: string, required: false, hint: "Leave blank to hide the footer link." }
          - { label: "TikTok URL", name: tiktok, widget: string, required: false, hint: "Leave blank to hide the footer link." }
          - { label: "What's Here intro", name: whatshere_intro, widget: text, required: false, hint: "The paragraph under the What's Here heading. Leave blank for the default." }
          
  - name: about
    label: "Who We Are"
    files:
      - name: history
        label: "PACA History"
        file: "paca-site/src/about/history.md"
        fields:
          - { label: "History", name: body, widget: markdown }

  - name: people
    label: "Board & Staff"
    label_singular: "Person"
    folder: "paca-site/src/people"
    create: true
    slug: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Role / Title", name: role, widget: string }
      - { label: "Group", name: group, widget: select, options: [Board, Staff], default: Staff }
      - { label: "Photo", name: photo, widget: image, required: false }
      - { label: "Order (low number = first)", name: order, widget: number, default: 1, value_type: int }
      - { label: "Short bio", name: bio, widget: text, required: false }
     
  - name: rent
    label: "Rent Our Spaces"
    files:
      - name: info
        label: "Rental Page Info"
        file: "paca-site/src/rent/rent.md"
        fields:
          - { label: "Rental info (text and photos)", name: body, widget: markdown }

  - name: gallery
    label: "Gallery"
    label_singular: "Photo"
    folder: "paca-site/src/gallery"
    create: true
    slug: "{{title}}"
    sortable_fields: [year, order, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Image", name: image, widget: image }
      - { label: "Category", name: category, widget: select, options: [Productions, Events, "The Space", People, Other], default: Productions }
      - { label: "Production / event name", name: production, widget: string, required: false }
      - { label: "Year", name: year, widget: number, required: false, value_type: int }
      - { label: "Caption", name: caption, widget: string, required: false }
      - { label: "Order (within a year)", name: order, widget: number, default: 1, value_type: int }

  - name: auditions
    label: "Auditions"
    files:
      - name: info
        label: "Audition Info"
        file: "paca-site/src/auditions/auditions.md"
        fields:
          - { label: "Audition information", name: body, widget: markdown }
          
  - name: tenants
    label: "What's Here"
    label_singular: "Tenant"
    description: "Artists, makers, and businesses in the building. Each one gets a directory card and its own page."
    folder: "paca-site/src/tenants"
    create: true
    slug: "{{unit}}"
    summary: "{{name}}  ·  Unit {{unit}}"
    sortable_fields: [unit, name]
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Unit / studio #", name: unit, widget: string, hint: "e.g. 2N1. Used for the page address and to sort." }
      - { label: "What they do", name: type, widget: string, required: false, hint: "A word or two, e.g. Painter, Recording studio." }
      - { label: "Logo (optional)", name: logo, widget: image, required: false, hint: "Small branding mark shown at the top of their page." }
      - { label: "Short summary", name: summary, widget: text, required: false, hint: "One or two sentences for the directory card." }
      - label: "Photos"
        name: gallery
        widget: list
        required: false
        label_singular: "Photo"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: image, widget: image }
          - { label: "Caption (optional)", name: caption, widget: string, required: false }
      - { label: "Phone (optional)", name: phone, widget: string, required: false }
      - { label: "Email (optional)", name: email, widget: string, required: false }
      - { label: "Website (optional)", name: website, widget: string, required: false }
      - { label: "Link the card straight to their website", name: link_out, widget: boolean, default: false, hint: "If on, the directory card links to their own site instead of their PACA page." }
      - { label: "Full description", name: body, widget: markdown }
  
  - name: homepage
    label: Homepage
    files:
      - name: hero
        label: "Hero & Announcement"
        file: "paca-site/src/_data/home.json"
        description: "The big text at the top of the home page, plus an optional announcement bar."
        fields:
          - { label: "Announcement (optional)", name: announcement, widget: string, required: false, hint: "Leave blank for none. When filled, it shows as a bar at the very top of the home page." }
          - { label: "Announcement link (optional)", name: announcement_link, widget: string, required: false }
          - { label: "Headline line 1", name: hero_line1, widget: string }
          - { label: "Headline line 2 (italic accent)", name: hero_line2, widget: string, required: false }
          - { label: "Intro paragraph", name: hero_blurb, widget: text }
 
  - name: archive
    label: "Past Productions"
    label_singular: "Past Production"
    description: "The history wall. Add shows from any past season, as far back as you like."
    folder: "paca-site/src/archive"
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} - {{title}}"
    sortable_fields: [year, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Year", name: year, widget: number, value_type: int, hint: "Just the year, e.g. 2014." }
      - { label: "Discipline", name: discipline, widget: select, options: [Theatre, Music, "Visual Art", Prose, Dance, Event, Party, Other], default: Theatre }
      - { label: "Image (optional)", name: image, widget: image, required: false }
      - { label: "Short blurb (optional)", name: blurb, widget: text, required: false }
      - { label: "Playbill (PDF, optional)", name: playbill, widget: file, required: false, hint: "Upload the playbill PDF. The link only appears when a file is set." }

  - name: sponsors
    label: Sponsors
    label_singular: Sponsor
    description: "Logos shown in the 'Special thanks to' bar at the bottom of every page."
    folder: "paca-site/src/sponsors"
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Logo", name: logo, widget: image }
      - { label: "Link (optional)", name: url, widget: string, required: false }
      - { label: "Order (lower shows first)", name: order, widget: number, default: 1, value_type: int }       