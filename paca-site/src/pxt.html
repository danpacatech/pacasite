---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Expenses</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#2B0B3E;
  --bone:#F4EDE0;
  --magenta:#ED2375;
  --cyan:#3FD3E8;
  --lime:#B8E62D;
  --yellow:#FFC72C;
  --orange:#FF7A1A;

  --bg:#2B0B3E;
  --chrome:#210834;
  --chrome-ink:#F4EDE0;
  --chrome-soft:#B99BD0;
  --panel:#F4EDE0;
  --panel-2:#EAE0CE;
  --ink:#1C0629;
  --ink-soft:#66566F;
  --line:#DACEBB;
  --field:#FFFFFF;
  --track:#DED2BF;
  --shadow:0 1px 0 rgba(28,6,41,.18);
  --pos:#3A770A;
  --hatch:rgba(28,6,41,.34);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140518;
    --chrome:#1B0725;
    --panel:#26102F;
    --panel-2:#31163C;
    --ink:#F4EDE0;
    --ink-soft:#B6A2BF;
    --line:#43214F;
    --field:#190A20;
    --track:#3A1A46;
    --shadow:0 1px 0 rgba(0,0,0,.4);
    --pos:#B8E62D;
    --hatch:rgba(244,237,224,.34);
  }
}
:root[data-theme="dark"]{
  --bg:#140518;
  --chrome:#1B0725;
  --panel:#26102F;
  --panel-2:#31163C;
  --ink:#F4EDE0;
  --ink-soft:#B6A2BF;
  --line:#43214F;
  --field:#190A20;
  --track:#3A1A46;
  --shadow:0 1px 0 rgba(0,0,0,.4);
  --pos:#B8E62D;
  --hatch:rgba(244,237,224,.34);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--chrome);color:var(--chrome-ink);
  border-bottom:1px solid rgba(244,237,224,.14);
}
.topbar-in{
  max-width:1100px;margin:0 auto;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{
  font-family:Anton,"Barlow Condensed",Impact,sans-serif;font-weight:400;
  font-size:22px;letter-spacing:.02em;line-height:1;color:var(--bone);
}
.brand span{
  font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.06em;
  color:var(--chrome-soft);white-space:nowrap;
}
.spacer{flex:1}
@media (max-width:430px){.brand span{display:none}.showpick{max-width:52vw}}
.showpick{
  background:rgba(244,237,224,.1);color:var(--chrome-ink);
  border:1px solid rgba(244,237,224,.24);border-radius:3px;
  padding:7px 10px;max-width:46vw;font-size:15px;
}
.icobtn{
  background:transparent;border:1px solid rgba(244,237,224,.24);border-radius:3px;
  color:var(--chrome-ink);width:36px;height:36px;display:grid;place-items:center;flex:none;
}
.icobtn:hover{background:rgba(244,237,224,.12)}
.icobtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:1100px;margin:0 auto;padding:14px 14px 20px}

/* ---------- hero ---------- */
.hero{
  background:var(--panel);border-radius:4px;box-shadow:var(--shadow);
  padding:16px 16px 14px;margin-bottom:12px;
}
.hero-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.hero-title{
  font-family:Anton,"Barlow Condensed",Impact,sans-serif;font-weight:400;
  font-size:clamp(26px,6.5vw,40px);line-height:1;letter-spacing:.01em;margin:0;
}
.hero-meta{color:var(--ink-soft);font-size:14px}
.pill{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);
}
.pill.warn{background:var(--yellow);border-color:#D8A800;color:#2B0B3E}
.pill.over{background:var(--magenta);border-color:var(--magenta);color:#fff}

.meter{margin:0 0 12px}
.meter-nums{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:7px}
.big{
  font-family:Anton,sans-serif;font-weight:400;line-height:.95;
  font-size:clamp(30px,8vw,46px);letter-spacing:.01em;
}
.big sub{font-family:"Hanken Grotesk",sans-serif;font-size:14px;font-weight:600;color:var(--ink-soft);vertical-align:baseline;margin-left:6px}
.of{text-align:right;color:var(--ink-soft);font-size:14px}
.of b{display:block;font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:18px;color:var(--ink);font-weight:600}

.bar{position:relative;height:18px;background:var(--track);border-radius:2px;overflow:hidden}
.bar .seg{position:absolute;top:0;bottom:0;left:0}
.bar .spent{background:var(--cyan)}
.bar .spent.over{background:var(--magenta)}
.bar .planned{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px)}
.bar .earned{background:var(--lime)}
.bar.tall{height:22px}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.mark::after{
  content:"";position:absolute;top:-2px;left:-3px;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid var(--ink);
}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:12.5px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
@media (min-width:660px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--panel);padding:9px 11px}
.stat dt{font-family:"Barlow Condensed",sans-serif;font-size:13.5px;letter-spacing:.05em;color:var(--ink-soft);margin:0}
.stat dd{margin:1px 0 0;font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:17px;font-weight:600}
.stat dd.neg{color:var(--magenta)}
.pos{color:var(--pos)}
.neg{color:var(--magenta)}
.daygroup b.pos,.catline-nums b.pos,.row .amt.pos,.stat dd.pos,.big.pos{color:var(--pos)}
.meters{display:grid;gap:4px 22px;margin-bottom:4px}
@media (min-width:760px){.meters{grid-template-columns:1.35fr 1fr}}
.meter-cap{font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:2px}
.meter.sm .big{font-size:clamp(26px,6.5vw,36px)}
.meter-empty{margin:18px 0 12px;align-self:center}
.legend i.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);border:1px solid var(--ink-soft)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:transparent;border:0;border-bottom:3px solid transparent;
  color:var(--chrome-soft);padding:9px 13px;border-radius:0;
  font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.04em;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--magenta)}
.tab .cnt{
  font-family:"Spline Sans Mono",monospace;font-size:12px;background:var(--magenta);color:#fff;
  border-radius:999px;padding:0 6px;margin-left:6px;
}

/* ---------- panels ---------- */
.panel{background:var(--panel);border-radius:4px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.panel-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
}
.panel-head h2{
  margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:20px;letter-spacing:.03em;
}
.panel-body{padding:14px}
.panel-body.flush{padding:0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.search{flex:1 1 180px;min-width:150px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:3px;
  padding:9px 10px;font-size:16px;
}
textarea{resize:vertical;min-height:62px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 100%}
@media (min-width:760px){.filters{grid-template-columns:repeat(4,1fr)}}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-soft)}
.chk input{width:auto}
.chk[hidden]{display:none}

.btn{
  background:var(--magenta);color:#fff;border:1px solid var(--magenta);border-radius:3px;
  padding:9px 14px;font-weight:600;font-size:15px;
}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);filter:none}
.btn.danger{background:transparent;color:var(--magenta);border-color:var(--magenta)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.inc{background:var(--lime);border-color:var(--lime);color:#2B0B3E}
.btn.armed{background:var(--magenta);border-color:var(--magenta);color:#fff}

/* ---------- expense rows ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;
  padding:11px 14px;border-bottom:1px solid var(--line);align-items:start;
  width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;
}
.row:hover{background:var(--panel-2)}
.row .what{font-weight:600;overflow-wrap:anywhere}
.row .amt{
  font-family:"Spline Sans Mono",ui-monospace,monospace;font-weight:600;font-size:16px;
  white-space:nowrap;text-align:right;
}
.row .sub{grid-column:1;color:var(--ink-soft);font-size:13.5px;overflow-wrap:anywhere}
.row.is-income{box-shadow:inset 3px 0 0 var(--lime)}
.row .tags{grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tag{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:2px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.tag.owed{background:var(--orange);border-color:var(--orange);color:#2B0B3E}
.tag.plan{background:transparent;border-style:dashed}
.tag.kind{background:var(--lime);border-color:var(--lime);color:#2B0B3E}
.daygroup{
  padding:7px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);
  font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.05em;color:var(--ink-soft);
  display:flex;justify-content:space-between;gap:10px;position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 57px);z-index:3;
}
.daygroup b{font-family:"Spline Sans Mono",monospace;font-weight:600;color:var(--ink)}

/* ---------- category lines ---------- */
.catline{padding:12px 14px;border-bottom:1px solid var(--line)}
.catline:last-child{border-bottom:0}
.catline-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.catline-name{font-weight:600}
.catline-nums{font-family:"Spline Sans Mono",monospace;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.catline-nums b{color:var(--ink)}
.catline-nums .over{color:var(--magenta)}
.budgetcell{display:flex;align-items:center;gap:6px;margin-top:8px}
.budgetcell label{font-size:13px;color:var(--ink-soft);flex:none}
.budgetcell input{max-width:130px;font-family:"Spline Sans Mono",monospace}
details.more{border-top:1px solid var(--line)}
details.more summary{padding:12px 14px;cursor:pointer;font-weight:600;color:var(--ink-soft);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"\2212  "}
.catrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.catrow label{font-weight:500}
.catrow input{max-width:130px;font-family:"Spline Sans Mono",monospace}

/* ---------- people ---------- */
.person{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.person:last-child{border-bottom:0}
.person .nm{font-weight:600;flex:1 1 40%}
.person .owe{font-family:"Spline Sans Mono",monospace;font-size:19px;font-weight:600}

.empty{padding:34px 18px;text-align:center;color:var(--ink-soft)}
.empty p{margin:0 0 14px}
.empty .hd{font-family:Anton,sans-serif;font-size:22px;color:var(--ink);margin-bottom:6px}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;
  display:flex;border-radius:999px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.fab button{border:0;padding:14px 16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.fab .fab-out{background:var(--magenta);color:#fff}
.fab .fab-in{background:var(--lime);color:#2B0B3E;border-left:1px solid rgba(43,11,62,.22)}
.fab[hidden]{display:none}
.fab svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,3,22,.62);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.scrim[hidden]{display:none}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{
  background:var(--panel);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:8px 8px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:700px){.sheet{border-radius:6px}}
.sheet-head{
  position:sticky;top:0;background:var(--panel);z-index:2;
  display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);
}
.sheet-head h2{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:22px;flex:1}
.sheet-body{padding:14px;display:grid;gap:12px}
.sheet-foot{
  position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:12px 14px;display:flex;gap:8px;
}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.danger{flex:none}
.f{display:grid;gap:5px}
.f>label{font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.04em;color:var(--ink-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money-in{font-family:"Spline Sans Mono",monospace;font-size:24px !important;font-weight:600;text-align:right}
.seg-ctl{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg-ctl button{flex:1;background:var(--field);border:0;padding:9px 6px;font-size:14px;font-weight:600;color:var(--ink-soft)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.typefilter{flex:0 0 auto}
.typefilter button{padding:9px 13px}
.kindswitch button{padding:11px 6px;font-size:15px}
.kindswitch button[data-etype="income"][aria-pressed="true"]{background:var(--lime);color:#2B0B3E}
.f2.solo{grid-template-columns:1fr}
.receipt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.receipt img{width:64px;height:64px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--ink-soft)}
.err{background:var(--magenta);color:#fff;padding:9px 12px;border-radius:3px;font-size:14px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--purple);color:var(--bone);border:1px solid var(--magenta);
  padding:10px 16px;border-radius:3px;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  max-width:90vw;text-align:center;
}
.toast[hidden]{display:none}

.statusline{
  max-width:1100px;margin:0 auto;padding:2px 14px 104px;
  color:var(--chrome-soft);font-size:12.5px;
}
.statusline b{color:var(--bone);font-weight:600}

@media print{
  body{background:#fff;color:#000}
  .topbar,.tabs,.fab,.toolbar,.scrim,.statusline,.noprint{display:none !important}
  main{padding:0;max-width:none}
  .panel,.hero{box-shadow:none;border:1px solid #bbb;break-inside:avoid;background:#fff}
  .row:hover{background:transparent}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>PACA</b><span>Production expenses</span></div>
    <div class="spacer"></div>
    <select id="showPick" class="showpick" aria-label="Choose a production"></select>
    <button class="icobtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero" id="hero"><div class="empty"><p>Loading your productions…</p></div></section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="expenses" aria-selected="true">Ledger</button>
    <button class="tab" role="tab" data-view="budget" aria-selected="false">Budget</button>
    <button class="tab" role="tab" data-view="owed" aria-selected="false">Reimbursements <span class="cnt" id="owedCnt" hidden>0</span></button>
    <button class="tab" role="tab" data-view="shows" aria-selected="false">Productions</button>
  </nav>

  <div id="views" role="tabpanel"></div>
</main>

<div class="fab" id="fab">
  <button type="button" class="fab-out" data-act="new-expense">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>Expense</button>
  <button type="button" class="fab-in" data-act="new-income">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Income</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<p class="statusline" id="statusline"></p>

<script>
"use strict";

/* =========================================================
   Constants
   ========================================================= */
const LS_KEY = "paca.pxt.v1";
const LS_UI  = "paca.pxt.ui";
const LS_RCP = "paca.pxt.rcp.";
const LS_PASS = "paca.pxt.key";
const NET_URL = "/.netlify/functions/pxt-data";

const DEFAULT_CATEGORIES = [
  "Scenery and lumber","Paint and finishes","Hardware and fasteners","Props",
  "Costumes","Hair, wigs and makeup","Lighting and gel","Sound","Projection and video",
  "Rigging and safety","Rights and royalties","Scripts and scores","Rentals",
  "Marketing and print","Photography","Hospitality and green room","Shipping","Other"
];
const METHODS = [
  "PACA card","PACA check","Petty cash","Personal (reimburse)","Invoice or PO","Donated (in-kind)"
];
const REIMBURSABLE = "Personal (reimburse)";
const INKIND = "Donated (in-kind)";

const DEFAULT_INCOME_CATEGORIES = [
  "Ticket sales","Concessions","Merchandise","Sponsorships","Program ads",
  "Donations","Grants","Fundraising events","Rental income","Other income"
];
const INCOME_METHODS = [
  "Online ticketing","Box office cash","Box office card","Check","Bank transfer","Other"
];
/** Entries saved before income existed have no type: they are expenses. */
const isIncome = e => !!e && e.type === "income";

const $ = (sel, root) => (root || document).querySelector(sel);
const cents = n => Math.round((Number(n) || 0) * 100);
const fromCents = c => c / 100;
const sumC = arr => arr.reduce((a, b) => a + b, 0);

function money(v, opts){
  const o = opts || {};
  const n = Number(v) || 0;
  const s = n.toLocaleString("en-US", {
    style:"currency", currency:"USD",
    minimumFractionDigits: o.whole ? 0 : 2,
    maximumFractionDigits: o.whole ? 0 : 2
  });
  return s;
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function parseISO(s){
  if (!s || typeof s !== "string") return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function fmtDate(iso, style){
  const d = parseISO(iso);
  if (!d) return "";
  return d.toLocaleDateString("en-US",
    style === "long"
      ? {weekday:"short", month:"short", day:"numeric", year:"numeric"}
      : {month:"short", day:"numeric"});
}
function daysUntil(iso){
  const d = parseISO(iso);
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function uid(){
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 2600);
}
function readUI(){

function writeUI(patch){

}

/* =========================================================
   Storage adapter: hosted db when available, otherwise this
   browser. Same calls either way.
   ========================================================= */
/* Talks to the Netlify Function when this page is served from a site that
 * has one. Calls are queued so replies always land in the order they were
 * sent. */
const net = {
  key: "",
  version: 0,
  queue: Promise.resolve(),

  call(method, body){
    const run = () => this.send(method, body);
    const p = this.queue.then(run, run);
    this.queue = p.catch(() => {});
    return p;
  },
  async send(method, body){
    const headers = {};
    if (this.key) headers["x-pxt-key"] = this.key;
    if (body) headers["content-type"] = "application/json";
    const res = await fetch(NET_URL, {
      method, headers, body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { const e = new Error("locked"); e.locked = true; throw e; }
    if (!res.ok) throw new Error("server said " + res.status);
    return res.json();
  },

  async probe(){
    if (location.protocol === "file:") return false;
    try { this.key = localStorage.getItem(LS_PASS) || ""; } catch (e) { this.key = ""; }
    for (let tries = 0; tries < 5; tries++) {
      try {
        adoptRemote(await this.call("GET"));
        return true;
      } catch (e) {
        if (!e.locked) return false;
        const k = await askKey(tries > 0 || !!this.key);
        if (k === null) return false;
        this.key = k;
      }
    }
    return false;
  },

  watch(){
    setInterval(async () => {
      if (store.mode !== "net" || document.hidden) return;
      if (!$("#scrim").hidden) return;          // never yank an open form
      try {
        const d = await this.call("GET");
        if ((Number(d.version) || 0) !== this.version) { adoptRemote(d); render(); }
      } catch (e) { /* offline for a moment, try again next tick */ }
    }, 20000);
  }
};

function adoptRemote(d){
  const toMap = o => new Map(Object.entries(o || {}).map(([id, v]) => [id, Object.assign({ id }, v)]));
  state.shows = toMap(d.shows);
  state.expenses = toMap(d.expenses);
  state.config = {
    categories: (d.config && Array.isArray(d.config.categories) && d.config.categories.length)
      ? d.config.categories.slice() : DEFAULT_CATEGORIES.slice(),
    people: (d.config && Array.isArray(d.config.people)) ? d.config.people.slice() : []
  };
  net.version = Number(d.version) || 0;
}

function askKey(retry){
  return new Promise(resolve => {
    openSheet(
      '<div class="sheet-head"><h2 id="sheetTitle">Passphrase</h2></div>' +
      '<form class="sheet-body" id="keyForm">' +
        (retry ? '<p class="err">That passphrase did not match.</p>' : "") +
        '<div class="f"><label for="keyIn">Shared passphrase</label>' +
          '<input type="password" id="keyIn" autocomplete="current-password"></div>' +
        '<p class="hint">Kept on this device so you only type it once. ' +
        'Skipping gives you a private copy on this device, not the shared book.</p>' +
      "</form>" +
      '<div class="sheet-foot">' +
        '<button class="btn ghost" id="keyCancel">Skip</button>' +
        '<button class="btn" id="keyGo">Unlock</button>' +
      "</div>");
    const go = () => {
      const v = $("#keyIn").value.trim();
      if (!v) { $("#keyIn").focus(); return; }
      try { localStorage.setItem(LS_PASS, v); } catch (e) {}
      closeSheet(); resolve(v);
    };
    $("#keyGo").addEventListener("click", go);
    $("#keyForm").addEventListener("submit", ev => { ev.preventDefault(); go(); });
    $("#keyCancel").addEventListener("click", () => { closeSheet(); resolve(null); });
  });
}

const store = {
  mode: "local",
  db: null,
  assets: null,
  user: null,

  async init(){
    let db = null, assets = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        db = await window.claude.use("db");
        if (db) {
          assets = await window.claude.use("assets");
          user   = await window.claude.use("user");
        }
      }
    } catch (e) { db = null; }

    this.assets = assets;
    this.user = user;

    if (db) {
      this.db = db;
      this.mode = "db";
      await this.attach();
    } else if (await net.probe()) {
      this.mode = "net";
      state.loaded = true;
      boot();
      net.watch();
    } else {
      this.mode = "local";
      this.loadLocal();
      state.loaded = true;
      boot();
    }
    paintStatus();
  },

  /* ---- hosted ---- */
  async attach(){
    const db = this.db;
    let seen = 0;
    const ready = () => {
      seen++;
      if (seen === 1) { state.loaded = true; boot(); }
      else render();
    };

    try {
      const can = this.user ? await this.user.can("data.write") : null;
      state.writable = (can === null) ? true : can;
    } catch (e) { state.writable = true; }

    db.doc("config/app").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      state.config = {
        categories: (d && Array.isArray(d.categories) && d.categories.length)
          ? d.categories.slice() : DEFAULT_CATEGORIES.slice(),
        people: (d && Array.isArray(d.people)) ? d.people.slice() : []
      };
      ready();
    }, e => dbErr(e));

    db.collection("shows").onSnapshot(snap => {
      state.shows = new Map(snap.docs.map(d => [d.id, Object.assign({ id:d.id }, d.data())]));
      if (state.loaded) render(); else ready();
    }, e => dbErr(e));

    db.collection("expenses").onSnapshot(snap => {
      state.expenses = new Map(snap.docs.map(d => [d.id, Object.assign({ id:d.id }, d.data())]));
      if (state.loaded) render(); else ready();
    }, e => dbErr(e));
  },

  /* ---- this browser ---- */
  loadLocal(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { raw = null; }
    const d = raw || {};
    // ids come from the keys, same as the shared-server loader, so a
    // record that lost its id field can never go missing from the view
    const toMap = o => new Map(Object.entries(o || {}).map(([id, v]) => [id, Object.assign({}, v, { id })]));
    state.shows = toMap(d.shows);
    state.expenses = toMap(d.expenses);
    state.config = {
      categories: (d.config && Array.isArray(d.config.categories) && d.config.categories.length)
        ? d.config.categories : DEFAULT_CATEGORIES.slice(),
      people: (d.config && Array.isArray(d.config.people)) ? d.config.people : []
    };
  },
  saveLocal(){
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        shows: Object.fromEntries(state.shows),
        expenses: Object.fromEntries(state.expenses),
        config: state.config
      }));
    } catch (e) {
      toast("This browser is out of storage room. Export a CSV backup.");
    }
  },

  /* ---- verbs ---- */
  async putShow(id, data){
    const body = Object.assign({}, data); delete body.id;
    if (this.mode === "db") { await this.db.doc("shows/" + id).set(body); return; }
    if (this.mode === "net") {
      adoptRemote(await net.call("POST", { op:"put", kind:"shows", id, record: body }));
      scheduleRender(); return;
    }
    state.shows.set(id, Object.assign({ id }, body)); this.saveLocal(); scheduleRender();
  },
  async delShow(id){
    const kids = [...state.expenses.values()].filter(e => e.showId === id);
    if (this.mode === "net") {
      adoptRemote(await net.call("POST", { op:"delShow", id }));
      scheduleRender(); return;
    }
    if (this.mode === "db") {
      for (const k of kids) { await this.db.doc("expenses/" + k.id).delete(); }
      await this.db.doc("shows/" + id).delete();
    } else {
      kids.forEach(k => state.expenses.delete(k.id));
      state.shows.delete(id); this.saveLocal(); scheduleRender();
    }
  },
  async putExpense(id, data){
    const body = Object.assign({}, data); delete body.id;
    if (this.mode === "db") { await this.db.doc("expenses/" + id).set(body); return; }
    if (this.mode === "net") {
      adoptRemote(await net.call("POST", { op:"put", kind:"expenses", id, record: body }));
      scheduleRender(); return;
    }
    state.expenses.set(id, Object.assign({ id }, body)); this.saveLocal(); scheduleRender();
  },
  async delExpense(id){
    if (this.mode === "db") { await this.db.doc("expenses/" + id).delete(); return; }
    if (this.mode === "net") {
      adoptRemote(await net.call("POST", { op:"del", kind:"expenses", id }));
      scheduleRender(); return;
    }
    state.expenses.delete(id); this.saveLocal(); scheduleRender();
  },
  async putConfig(){
    if (this.mode === "db") { await this.db.doc("config/app").set({
      categories: state.config.categories, people: state.config.people
    }); return; }
    if (this.mode === "net") {
      await net.call("POST", { op:"config", config: {
        categories: state.config.categories, people: state.config.people
      }});
      return;
    }
    this.saveLocal(); scheduleRender();
  },

  /* ---- receipts ---- */
  async saveReceipt(blob){
    if (this.mode === "net") {
      const id = uid();
      const b64 = (await blobToDataURL(blob)).split(",")[1];
      await net.call("POST", { op:"receipt", id, b64 });
      return { ref: "net:" + id, local: false };
    }
    if (this.assets) {
      const up = await this.assets.upload(blob, { type: "image/jpeg" });
      return { ref: up.id, local: false };
    }
    const id = uid();
    const dataUrl = await blobToDataURL(blob);
    try { localStorage.setItem(LS_RCP + id, dataUrl); }
    catch (e) { throw new Error("No room left to store this photo on this device."); }
    return { ref: "local:" + id, local: true };
  },
  receiptSrc(ref){
    if (!ref) return null;
    if (ref.indexOf("net:") === 0) {
      return NET_URL + "?receipt=" + encodeURIComponent(ref.slice(4)) +
        (net.key ? "&k=" + encodeURIComponent(net.key) : "");
    }
    if (ref.indexOf("local:") === 0) {
      try { return localStorage.getItem(LS_RCP + ref.slice(6)); } catch (e) { return null; }
    }
    return "/_blob/" + ref;
  }
};

function dbErr(e){
  const code = e && e.code;
  if (code === "revoked" || code === "not_granted") { state.writable = false; render(); return; }
  console.error("store", e);
}

function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(blob);
  });
}

async function shrinkImage(file){
  const dataUrl = await blobToDataURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("That file is not an image we can read."));
    i.src = dataUrl;
  });
  const max = 1400;
  let { width:w, height:h } = img;
  if (w > max || h > max) {
    const k = max / Math.max(w, h);
    w = Math.round(w * k); h = Math.round(h * k);
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", 0.72));
}

/* =========================================================
   Derived numbers
   ========================================================= */
let renderTimer = 0;
function scheduleRender(){
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 0);
}

function signedMoney(v, opts){
  return (v > 0.004 ? "+" : "") + money(v, opts);
}

/** The production's income goal, or the sum of its category goals. */
function incomeGoalFor(show){
  const g = Number(show.incomeGoal) || 0;
  if (g > 0) return g;
  return fromCents(sumC(Object.values(show.incomeGoals || {}).map(v => cents(v))));
}

function groupedOptions(groups, sel, blank){
  return '<option value="">' + esc(blank) + "</option>" +
    groups.map(([label, items]) =>
      '<optgroup label="' + esc(label) + '">' +
      items.map(i => '<option value="' + esc(i) + '"' + (i === sel ? " selected" : "") + ">" +
        esc(i) + "</option>").join("") +
      "</optgroup>").join("");
}

function activeShow(){
  if (state.activeShowId && state.shows.has(state.activeShowId)) {
    return state.shows.get(state.activeShowId);
  }
  return null;
}
function showExpenses(showId){
  return [...state.expenses.values()].filter(e => e.showId === showId);
}
function sortExpenses(list){
  return list.slice().sort((a, b) => {
    if (a.date !== b.date) return (b.date || "").localeCompare(a.date || "");
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}
/** Cash totals ignore in-kind; in-kind is tracked on its own. */
/** Cash totals ignore in-kind; in-kind is tracked on its own. */
function totals(list){
  let spent = 0, planned = 0, inkind = 0, owed = 0, inc = 0, incExp = 0;
  for (const e of list) {
    const c = cents(e.amount);
    if (isIncome(e)) { if (e.planned) incExp += c; else inc += c; continue; }
    if (e.method === INKIND) { inkind += c; continue; }
    if (e.planned) planned += c; else spent += c;
    if (!e.planned && e.method === REIMBURSABLE && !e.reimbursed) owed += c;
  }
  return {
    spent: fromCents(spent), planned: fromCents(planned),
    inkind: fromCents(inkind), owed: fromCents(owed),
    committed: fromCents(spent + planned),
    income: fromCents(inc), incomeExpected: fromCents(incExp),
    incomeAll: fromCents(inc + incExp),
    net: fromCents(inc - spent),
    projectedNet: fromCents(inc + incExp - spent - planned)
  };
}
function byCategory(list){
  const map = new Map();
  for (const e of list) {
    const k = e.category || "Other";
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  }
  return map;
}
function owedByPerson(list){
  const map = new Map();
  for (const e of list) {
    if (isIncome(e) || e.planned || e.method !== REIMBURSABLE || e.reimbursed) continue;
    const k = (e.paidBy || "").trim() || "Unnamed";
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  }
  return [...map.entries()]
    .map(([name, items]) => ({
      name, items,
      total: fromCents(sumC(items.map(i => cents(i.amount))))
    }))
    .sort((a, b) => b.total - a.total);
}

/* =========================================================
   Bar drawing
   ========================================================= */
function barHTML(done, planned, target, opts){
  const o = opts || {};
  const income = o.kind === "income";
  const scale = Math.max(target, done + planned, 0.01);
  const sPct = Math.min(100, (done / scale) * 100);
  const pPct = Math.min(100 - sPct, (planned / scale) * 100);
  const over = !income && target > 0 && done > target + 0.004;
  const mark = target > 0 && target < done + planned
    ? '<span class="mark" style="left:' + ((target / scale) * 100).toFixed(2) + '%"></span>'
    : "";
  const label = income
    ? money(done) + " received of " + (target > 0 ? money(target) + " goal" : "no goal set")
    : money(done) + " spent of " + (target > 0 ? money(target) + " budget" : "no budget set");
  return '<div class="bar' + (o.tall ? " tall" : "") + '" role="img" aria-label="' + esc(label) + '">' +
    '<span class="seg ' + (income ? "earned" : "spent") + (over ? " over" : "") +
      '" style="width:' + sPct.toFixed(2) + '%"></span>' +
    '<span class="seg planned" style="left:' + sPct.toFixed(2) + '%;width:' + pPct.toFixed(2) + '%"></span>' +
    mark +
    "</div>";
}

function renderHero(){
  const el = $("#hero");
  const show = activeShow();

  if (!show) {
    el.innerHTML =
      '<div class="empty">' +
        '<div class="hd">No production yet</div>' +
        '<p>Add a show, set its budget, then log what goes out and what comes in.</p>' +
        '<button class="btn" data-act="new-show">Add a production</button>' +
      "</div>";
    return;
  }

  const t = totals(showExpenses(show.id));
  const budget = Number(show.budget) || 0;
  const goal = incomeGoalFor(show);
  const remaining = budget - t.committed;
  const pct = budget > 0 ? Math.round((t.committed / budget) * 100) : 0;
  const dLeft = daysUntil(show.opensOn);

  let flag = "";
  if (budget > 0 && t.committed > budget) {
    flag = '<span class="pill over">' + money(t.committed - budget, { whole:true }) + " over</span>";
  } else if (budget > 0 && pct >= 85) {
    flag = '<span class="pill warn">' + pct + "% committed</span>";
  }

  let when = "";
  if (show.opensOn && dLeft !== null) {
    when = dLeft > 1 ? "Opens in " + dLeft + " days" :
      dLeft === 1 ? "Opens tomorrow" :
      dLeft === 0 ? "Opens today" :
      "Opened " + fmtDate(show.opensOn, "long");
  }

  const costs =
    '<div class="meter">' +
      '<div class="meter-cap">Costs</div>' +
      '<div class="meter-nums">' +
        '<div class="big">' + money(t.committed, { whole:true }) +
          "<sub>committed" + (t.planned > 0 ? ", " + money(t.planned, { whole:true }) + " planned" : "") + "</sub></div>" +
        '<div class="of">' + (budget > 0 ? "budget<b>" + money(budget, { whole:true }) + "</b>" : "no budget set") + "</div>" +
      "</div>" +
      barHTML(t.spent, t.planned, budget, { tall:true }) +
    "</div>";

  const income = (t.incomeAll > 0 || goal > 0)
    ? '<div class="meter sm">' +
        '<div class="meter-cap">Income</div>' +
        '<div class="meter-nums">' +
          '<div class="big pos">' + money(t.income, { whole:true }) +
            "<sub>received" + (t.incomeExpected > 0 ? ", " + money(t.incomeExpected, { whole:true }) + " expected" : "") + "</sub></div>" +
          '<div class="of">' + (goal > 0 ? "goal<b>" + money(goal, { whole:true }) + "</b>" : "no goal set") + "</div>" +
        "</div>" +
        barHTML(t.income, t.incomeExpected, goal, { kind:"income", tall:true }) +
      "</div>"
    : '<p class="hint meter-empty">No income logged yet. Use <b>Income</b> for ticket sales, concessions and sponsorships.</p>';

  const legend =
    '<div class="legend">' +
      '<span><i style="background:var(--cyan)"></i>Paid</span>' +
      (t.incomeAll > 0 || goal > 0 ? '<span><i style="background:var(--lime)"></i>Received</span>' : "") +
      '<span><i class="hatch"></i>Planned or expected</span>' +
      (budget > 0 || goal > 0 ? "<span>▾ budget or goal</span>" : "") +
    "</div>";

  const stat = (label, value, cls) =>
    '<div class="stat"><dt>' + label + '</dt><dd class="' + (cls || "") + '">' + value + "</dd></div>";
  const netCls = t.net > 0.004 ? "pos" : t.net < -0.004 ? "neg" : "";

  const stats =
    '<dl class="stats" style="margin-top:12px">' +
      stat("Paid out", money(t.spent)) +
      stat("Income received", money(t.income), t.income > 0 ? "pos" : "") +
      stat("Net so far", signedMoney(t.net), netCls) +
      (budget > 0
        ? stat(remaining < 0 ? "Over budget" : "Left to spend", money(Math.abs(remaining)), remaining < 0 ? "neg" : "")
        : stat("Cost budget", "Not set")) +
      stat("Owed to people", money(t.owed), t.owed > 0 ? "neg" : "") +
      stat("Expected income", money(t.incomeExpected)) +
    "</dl>";

  const notes = [];
  if (t.committed > 0 || t.incomeAll > 0) {
    const need = t.committed - t.incomeAll;
    const counting = t.incomeExpected > 0 ? " (counting expected income)" : "";
    notes.push(need > 0.004
      ? "Needs <b>" + money(need) + "</b> more income to cover committed costs" + counting + "."
      : "Covers committed costs with <b>" + money(-need) + "</b> to spare" + counting + ".");
  }
  if (t.inkind > 0) notes.push("Plus " + money(t.inkind) + " donated in kind, tracked apart from cash.");

  el.innerHTML =
    '<div class="hero-head">' +
      '<h1 class="hero-title">' + esc(show.name) + "</h1>" +
      '<span class="hero-meta">' + esc([show.season, when].filter(Boolean).join("  •  ")) + "</span>" +
      flag +
    "</div>" +
    '<div class="meters">' + costs + income + "</div>" +
    legend + stats +
    (notes.length ? '<p class="hint" style="margin:10px 0 0">' + notes.join(" ") + "</p>" : "");
}

function renderViews(){
  const host = $("#views");
  const show = activeShow();

  // keep focus and caret on whatever the user was in, across the rebuild
  const active = document.activeElement;
  const keepId = active && active.id && host.contains(active) ? active.id : null;
  let caret = null;
  if (keepId) { try { caret = [active.selectionStart, active.selectionEnd]; } catch (e) { caret = null; } }

  if (!show && state.view !== "shows") { host.innerHTML = ""; return; }

  if (state.view === "expenses") host.innerHTML = viewExpenses(show);
  else if (state.view === "budget") host.innerHTML = viewBudget(show);
  else if (state.view === "owed") host.innerHTML = viewOwed(show);
  else host.innerHTML = viewShows();

  if (state.view === "expenses") {
    const f = state.filters;
    const setv = (id, v) => { const el = $(id); if (el) el.value = v; };
    setv("#q", f.q); setv("#fCat", f.cat); setv("#fPerson", f.person);
    setv("#fMethod", f.method); setv("#fKind", f.kind);
  }

  if (keepId) {
    const again = document.getElementById(keepId);
    if (again && again !== document.activeElement) {
      try { again.focus({ preventScroll:true }); } catch (e) { again.focus(); }
      if (caret && caret[0] !== null) { try { again.setSelectionRange(caret[0], caret[1]); } catch (e) {} }
    }
  }
}

function optionList(items, sel, blank){
  return '<option value="">' + esc(blank) + "</option>" +
    items.map(i => '<option value="' + esc(i) + '"' + (i === sel ? " selected" : "") + ">" + esc(i) + "</option>").join("");
}

function filterExpenses(list){
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  return list.filter(e => {
    if (f.type === "income" && !isIncome(e)) return false;
    if (f.type === "expense" && isIncome(e)) return false;
    if (f.cat && e.category !== f.cat) return false;
    if (f.person && (e.paidBy || "") !== f.person) return false;
    if (f.method && e.method !== f.method) return false;
    if (f.kind === "planned" && !e.planned) return false;
    if (f.kind === "paid" && e.planned) return false;
    if (f.kind === "owed" && !(!isIncome(e) && e.method === REIMBURSABLE && !e.reimbursed && !e.planned)) return false;
    if (q) {
      const hay = [e.item, e.vendor, e.category, e.paidBy, e.notes].join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function countLabel(shown, total){
  return shown === total
    ? total + (total === 1 ? " entry" : " entries")
    : shown + " of " + total;
}

function headTotals(list){
  const t = totals(list);
  const parts = [];
  if (t.committed > 0 || t.incomeAll === 0) parts.push("<b>" + money(t.committed) + "</b> out");
  if (t.incomeAll > 0) parts.push('<b class="pos">+' + money(t.incomeAll) + "</b> in");
  return parts.join(" &nbsp;");
}

function expenseListHTML(show, all, list){
  if (!all.length) {
    return '<div class="empty">' +
      '<div class="hd">Nothing logged yet</div>' +
      "<p>Log the first receipt or ticket sales for " + esc(show.name) + ".</p>" +
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn" data-act="new-expense">Add expense</button>' +
        '<button class="btn inc" data-act="new-income">Add income</button>' +
      "</div></div>";
  }
  if (!list.length) {
    return '<div class="empty"><p>Nothing matches those filters.</p>' +
      '<button class="btn ghost" data-act="clear-filters">Clear filters</button></div>';
  }
  let html = '<ul class="rows">';
  let lastDate = null;
  for (const e of list) {
    if (e.date !== lastDate) {
      lastDate = e.date;
      const day = list.filter(x => x.date === e.date);
      const out = fromCents(sumC(day.filter(x => !isIncome(x) && x.method !== INKIND).map(x => cents(x.amount))));
      const inn = fromCents(sumC(day.filter(isIncome).map(x => cents(x.amount))));
      html += '<li class="daygroup"><span>' + esc(fmtDate(e.date, "long") || "No date") + "</span><span>" +
        (inn > 0 ? '<b class="pos">+' + money(inn) + "</b>" : "") +
        (inn > 0 && out > 0 ? " &nbsp;" : "") +
        (out > 0 || inn === 0 ? "<b>" + money(out) + "</b>" : "") +
        "</span></li>";
    }
    html += "<li>" + expenseRow(e) + "</li>";
  }
  return html + "</ul>";
}

function expenseRow(e){
  const inc = isIncome(e);
  const tags = [];
  if (e.planned) tags.push('<span class="tag plan">' + (inc ? "expected" : "planned") + "</span>");
  if (!inc && e.method === INKIND) tags.push('<span class="tag kind">in kind</span>');
  else if (!inc && e.method === REIMBURSABLE && !e.reimbursed && !e.planned) tags.push('<span class="tag owed">owed</span>');
  if (e.receipt) tags.push('<span class="tag">' + (inc ? "photo" : "receipt") + "</span>");

  const sub = inc
    ? [e.category, e.vendor ? "from " + e.vendor : "", e.method].filter(Boolean).join("  •  ")
    : [e.category, e.vendor, e.paidBy ? "paid by " + e.paidBy : ""].filter(Boolean).join("  •  ");
  return '<button class="row' + (inc ? " is-income" : "") + '" data-open="' + esc(e.id) + '">' +
    '<span class="what">' + esc(e.item || "Untitled") + "</span>" +
    '<span class="amt' + (inc ? " pos" : "") + '">' + (inc ? "+" : "") + money(e.amount) + "</span>" +
    '<span class="sub">' + esc(sub) + "</span>" +
    '<span class="tags">' + tags.join("") + "</span>" +
  "</button>";
}

function viewBudget(show){
  const list = showExpenses(show.id);
  const costs = list.filter(e => !isIncome(e));
  const income = list.filter(isIncome);
  const edit = state.writable ? "" : " disabled";

  /* ---- costs ---- */
  const map = byCategory(costs);
  const budgets = show.categoryBudgets || {};
  const names = [...new Set([...state.config.categories, ...map.keys(), ...Object.keys(budgets)])];
  const active = names.filter(n => (map.get(n) || []).length || Number(budgets[n]) > 0);
  const idle = names.filter(n => active.indexOf(n) === -1);

  const rows = active.map(name => {
    const items = map.get(name) || [];
    const t = totals(items);
    const b = Number(budgets[name]) || 0;
    const over = b > 0 && t.spent > b + 0.004;
    const left = b - t.committed;
    return '<div class="catline">' +
      '<div class="catline-top">' +
        '<span class="catline-name">' + esc(name) + "</span>" +
        '<span class="catline-nums"><b class="' + (over ? "over" : "") + '">' + money(t.committed) + "</b>" +
          (b > 0 ? " / " + money(b, { whole:true }) : " / no budget") + "</span>" +
      "</div>" +
      barHTML(t.spent, t.planned, b) +
      '<div class="catline-top" style="margin:6px 0 0">' +
        '<span class="hint">' + items.length + (items.length === 1 ? " item" : " items") +
          (t.inkind > 0 ? ", plus " + money(t.inkind) + " in kind" : "") + "</span>" +
        '<span class="hint">' + (b > 0 ? (left < 0 ? money(-left) + " over" : money(left) + " left") : "") + "</span>" +
      "</div>" +
      '<div class="budgetcell noprint">' +
        '<label for="b-' + slug(name) + '">Budget</label>' +
        '<input type="number" inputmode="decimal" step="1" min="0" id="b-' + slug(name) + '" ' +
          'data-budget-for="' + esc(name) + '" value="' + (b > 0 ? b : "") + '" placeholder="0"' + edit + ">" +
      "</div>" +
    "</div>";
  });

  const idleCosts = idle.length && state.writable
    ? '<details class="more noprint" id="budgetMore"' + (state.open.budgetMore ? " open" : "") + ">" +
        "<summary>Budget " + idle.length + " more categor" + (idle.length === 1 ? "y" : "ies") + "</summary>" +
        idle.map(n =>
          '<div class="catrow"><label for="b-' + slug(n) + '">' + esc(n) + "</label>" +
          '<input type="number" inputmode="decimal" step="1" min="0" id="b-' + slug(n) + '" ' +
            'data-budget-for="' + esc(n) + '" placeholder="0"></div>').join("") +
      "</details>"
    : "";

  const allocated = fromCents(sumC(Object.values(budgets).map(v => cents(v))));
  const total = Number(show.budget) || 0;
  const unallocated = total - allocated;

  /* ---- income ---- */
  const imap = byCategory(income);
  const goals = show.incomeGoals || {};
  const inames = [...new Set([...DEFAULT_INCOME_CATEGORIES, ...imap.keys(), ...Object.keys(goals)])];
  const iactive = inames.filter(n => (imap.get(n) || []).length || Number(goals[n]) > 0);
  const iidle = inames.filter(n => iactive.indexOf(n) === -1);

  const irows = iactive.map(name => {
    const items = imap.get(name) || [];
    const t = totals(items);
    const g = Number(goals[name]) || 0;
    const left = g - t.incomeAll;
    return '<div class="catline">' +
      '<div class="catline-top">' +
        '<span class="catline-name">' + esc(name) + "</span>" +
        '<span class="catline-nums"><b class="pos">' + money(t.incomeAll) + "</b>" +
          (g > 0 ? " / " + money(g, { whole:true }) : " / no goal") + "</span>" +
      "</div>" +
      barHTML(t.income, t.incomeExpected, g, { kind:"income" }) +
      '<div class="catline-top" style="margin:6px 0 0">' +
        '<span class="hint">' + items.length + (items.length === 1 ? " entry" : " entries") +
          (t.incomeExpected > 0 ? ", " + money(t.incomeExpected) + " still expected" : "") + "</span>" +
        '<span class="hint">' + (g > 0 ? (left > 0.004 ? money(left) + " to goal" : "goal met") : "") + "</span>" +
      "</div>" +
      '<div class="budgetcell noprint">' +
        '<label for="g-' + slug(name) + '">Goal</label>' +
        '<input type="number" inputmode="decimal" step="1" min="0" id="g-' + slug(name) + '" ' +
          'data-goal-for="' + esc(name) + '" value="' + (g > 0 ? g : "") + '" placeholder="0"' + edit + ">" +
      "</div>" +
    "</div>";
  });

  const idleIncome = iidle.length && state.writable
    ? '<details class="more noprint" id="goalMore"' + (state.open.goalMore ? " open" : "") + ">" +
        "<summary>Set goals for " + iidle.length + " more categor" + (iidle.length === 1 ? "y" : "ies") + "</summary>" +
        iidle.map(n =>
          '<div class="catrow"><label for="g-' + slug(n) + '">' + esc(n) + "</label>" +
          '<input type="number" inputmode="decimal" step="1" min="0" id="g-' + slug(n) + '" ' +
            'data-goal-for="' + esc(n) + '" placeholder="0"></div>').join("") +
      "</details>"
    : "";

  const it = totals(income);
  const goalTotal = incomeGoalFor(show);
  const catGoalSum = fromCents(sumC(Object.values(goals).map(v => cents(v))));

  return '<section class="panel">' +
    '<div class="panel-head"><h2>Costs by category</h2><span class="spacer"></span>' +
      '<button class="btn ghost sm noprint" data-act="edit-show">Edit production</button></div>' +
    '<div class="panel-body" style="border-bottom:1px solid var(--line)">' +
      '<div class="catline-top" style="margin:0">' +
        '<span class="hint">Allocated across categories</span>' +
        '<span class="catline-nums"><b>' + money(allocated) + "</b> / " + money(total, { whole:true }) + "</span>" +
      "</div>" +
      (total > 0
        ? '<p class="hint" style="margin:6px 0 0">' +
          (unallocated >= 0
            ? money(unallocated) + " of the cost budget is not assigned to a category yet."
            : "Category budgets exceed the cost budget by " + money(-unallocated) + ".") + "</p>"
        : '<p class="hint" style="margin:6px 0 0">Set a cost budget on the production to compare against.</p>') +
    "</div>" +
    '<div class="panel-body flush">' +
      (rows.length ? rows.join("") : '<div class="empty"><p>No category budgets or costs yet.</p></div>') +
      idleCosts +
    "</div>" +
  "</section>" +

  '<section class="panel">' +
    '<div class="panel-head"><h2>Income by category</h2></div>' +
    '<div class="panel-body" style="border-bottom:1px solid var(--line)">' +
      '<div class="catline-top" style="margin:0">' +
        '<span class="hint">Brought in so far</span>' +
        '<span class="catline-nums"><b class="pos">' + money(it.income) + "</b>" +
          (goalTotal > 0 ? " / " + money(goalTotal, { whole:true }) + " goal" : "") + "</span>" +
      "</div>" +
      (it.incomeExpected > 0 ? '<p class="hint" style="margin:6px 0 0">Plus ' + money(it.incomeExpected) + " expected.</p>" : "") +
      (Number(show.incomeGoal) > 0 && catGoalSum > 0 && Math.abs(catGoalSum - Number(show.incomeGoal)) > 0.004
        ? '<p class="hint" style="margin:6px 0 0">Category goals add up to ' + money(catGoalSum) + ".</p>" : "") +
    "</div>" +
    '<div class="panel-body flush">' +
      (irows.length ? irows.join("") : '<div class="empty"><p>No income goals or income yet.</p></div>') +
      idleIncome +
    "</div>" +
  "</section>";
}

function peopleList(){
  const set = new Set(state.config.people || []);
  for (const e of state.expenses.values()) if (e.paidBy) set.add(e.paidBy);
  return [...set].sort((a, b) => a.localeCompare(b));
}
function vendorList(type){
  const set = new Set();
  for (const e of state.expenses.values()) {
    if (!e.vendor) continue;
    if ((type === "income") !== isIncome(e)) continue;
    set.add(e.vendor);
  }
  return [...set].sort((a, b) => a.localeCompare(b));
}

/** Two-tap confirm. Modal dialogs can be blocked in an embedded page,
 *  so destructive buttons arm themselves instead. */
function armed(btn, label){
  if (btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1";
  btn.dataset.wasLabel = btn.textContent;
  btn.textContent = label;
  btn.classList.add("armed");
  setTimeout(() => {
    if (!btn.isConnected || btn.dataset.armed !== "1") return;
    btn.dataset.armed = "";
    btn.textContent = btn.dataset.wasLabel || "Delete";
    btn.classList.remove("armed");
  }, 5000);
  return false;
}

function expenseSheet(existing, kind){
  const show = activeShow();
  const ui = readUI();
  const type = existing ? (isIncome(existing) ? "income" : "expense") : (kind === "income" ? "income" : "expense");
  const e = existing ? Object.assign({}, existing) : {
    id: uid(), showId: show.id, type, date: todayISO(), item: "", vendor: "",
    category: type === "income" ? (ui.lastIncomeCat || "") : (ui.lastCat || ""),
    amount: "", paidBy: type === "income" ? "" : (ui.lastPerson || ""),
    method: type === "income" ? (ui.lastIncomeMethod || INCOME_METHODS[0]) : (ui.lastMethod || "PACA card"),
    planned: false, reimbursed: false, notes: "", receipt: null, createdAt: Date.now()
  };
  e.type = type;
  state.editingExpense = e;

  const L = LABELS[type];
  const inc = type === "income";
  const cats = inc ? DEFAULT_INCOME_CATEGORIES : state.config.categories;
  const methods = inc ? INCOME_METHODS : METHODS;
  const src = e.receipt ? store.receiptSrc(e.receipt) : null;
  const k = existing ? 1 : 0;
  const tbtn = (v, label) =>
    '<button type="button" data-etype="' + v + '" aria-pressed="' + (type === v) + '">' + label + "</button>";

  return '<div class="sheet-head">' +
      '<h2 id="sheetTitle">' + L.title[k] + "</h2>" +
      '<button class="icobtn" data-act="close" aria-label="Close">' +
        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
    "</div>" +
    '<form class="sheet-body" id="expForm" novalidate>' +
      '<div class="seg-ctl kindswitch" id="entryType" role="group" aria-label="Entry type">' +
        tbtn("expense", "Money out") + tbtn("income", "Money in") +
      "</div>" +

      '<div class="f"><label for="fAmount">Amount</label>' +
        '<input class="money-in" type="number" inputmode="decimal" step="0.01" min="0" id="fAmount" ' +
        'value="' + esc(e.amount) + '" placeholder="0.00" required></div>' +

      '<div class="f"><label for="fItem" id="lblItem">' + L.item + "</label>" +
        '<input type="text" id="fItem" value="' + esc(e.item) + '" placeholder="' + esc(L.itemPh) + '" required></div>' +

      '<div class="f2">' +
        '<div class="f"><label for="fDate">Date</label>' +
          '<input type="date" id="fDate" value="' + esc(e.date) + '"></div>' +
        '<div class="f"><label for="fCategory">Category</label>' +
          '<select id="fCategory">' + optionList(cats, e.category, "Pick one") + "</select></div>" +
      "</div>" +

      '<div class="f2' + (inc ? " solo" : "") + '" id="whoRow">' +
        '<div class="f"><label for="fVendor" id="lblVendor">' + L.vendor + "</label>" +
          '<input type="text" id="fVendor" list="vendors" value="' + esc(e.vendor) + '" placeholder="' + esc(L.vendorPh) + '"></div>' +
        '<div class="f" id="paidByWrap"' + (inc ? " hidden" : "") + '><label for="fPaidBy">Paid by</label>' +
          '<input type="text" id="fPaidBy" list="people" value="' + esc(e.paidBy) + '" placeholder="Name"></div>' +
      "</div>" +
      '<datalist id="vendors">' + vendorList(type).map(v => '<option value="' + esc(v) + '">').join("") + "</datalist>" +
      '<datalist id="people">' + peopleList().map(v => '<option value="' + esc(v) + '">').join("") + "</datalist>" +

      '<div class="f"><label for="fMethodIn" id="lblMethod">' + L.method + "</label>" +
        '<select id="fMethodIn">' + methods.map(m =>
          '<option value="' + esc(m) + '"' + (m === e.method ? " selected" : "") + ">" + esc(m) + "</option>").join("") +
        "</select></div>" +

      '<div class="f"><label>Status</label>' +
        '<div class="seg-ctl" id="fPlanned">' +
          '<button type="button" data-planned="0" aria-pressed="' + (!e.planned) + '">' + L.done + "</button>" +
          '<button type="button" data-planned="1" aria-pressed="' + (!!e.planned) + '">' + L.pending + "</button>" +
        "</div></div>" +

      '<label class="chk" id="reimbWrap"' + (!inc && e.method === REIMBURSABLE ? "" : " hidden") + ">" +
        '<input type="checkbox" id="fReimbursed"' + (e.reimbursed ? " checked" : "") + "> Already reimbursed</label>" +

      '<div class="f"><label for="fNotes">Notes</label>' +
        '<textarea id="fNotes" placeholder="Receipt number, what it is for, who approved it">' + esc(e.notes || "") + "</textarea></div>" +

      '<div class="f"><label id="lblReceipt">' + L.receipt + "</label>" +
        '<div class="receipt" id="receiptBox">' +
          (src ? '<img src="' + esc(src) + '" alt="Attached photo">' : "") +
          '<input type="file" id="fReceipt" accept="image/*" capture="environment" style="flex:1;min-width:150px">' +
          (e.receipt ? '<button type="button" class="btn ghost sm" data-act="drop-receipt">Remove</button>' : "") +
        "</div>" +
        (store.assets || store.mode === "net" ? ""
          : '<p class="hint">Photos are stored in this browser only.</p>') +
      "</div>" +
      '<div id="expErr"></div>' +
    "</form>" +
    '<div class="sheet-foot">' +
      (existing ? '<button class="btn danger" data-act="delete-expense">Delete</button>' : "") +
      '<button class="btn ghost" data-act="close">Cancel</button>' +
      '<button class="btn' + (inc ? " inc" : "") + '" id="saveEntry" data-act="save-expense">' + L.save[k] + "</button>" +
    "</div>";
}

/** Flip an open entry form between money out and money in, in place,
 *  so nothing already typed is lost. */
function applyEntryType(type){
  const e = state.editingExpense;
  if (!e || (type !== "income" && type !== "expense")) return;
  e.type = type;
  const L = LABELS[type];
  const inc = type === "income";
  const ui = readUI();
  const k = state.expenses.has(e.id) ? 1 : 0;
  const set = (sel, fn) => { const el = $(sel); if (el) fn(el); };

  set("#sheetTitle", el => { el.textContent = L.title[k]; });
  set("#saveEntry", el => { el.textContent = L.save[k]; el.classList.toggle("inc", inc); });
  set("#lblItem", el => { el.textContent = L.item; });
  set("#fItem", el => { el.placeholder = L.itemPh; });
  set("#lblVendor", el => { el.textContent = L.vendor; });
  set("#fVendor", el => { el.placeholder = L.vendorPh; });
  set("#lblMethod", el => { el.textContent = L.method; });
  set("#lblReceipt", el => { el.textContent = L.receipt; });
  set('#fPlanned [data-planned="0"]', el => { el.textContent = L.done; });
  set('#fPlanned [data-planned="1"]', el => { el.textContent = L.pending; });
  set("#paidByWrap", el => { el.hidden = inc; });
  set("#whoRow", el => { el.classList.toggle("solo", inc); });
  set("#vendors", el => { el.innerHTML = vendorList(type).map(v => '<option value="' + esc(v) + '">').join(""); });

  const cats = inc ? DEFAULT_INCOME_CATEGORIES : state.config.categories;
  set("#fCategory", el => {
    const last = inc ? ui.lastIncomeCat : ui.lastCat;
    const keep = cats.indexOf(el.value) !== -1 ? el.value : (cats.indexOf(last) !== -1 ? last : "");
    el.innerHTML = optionList(cats, keep, "Pick one");
    el.value = keep;
  });
  const methods = inc ? INCOME_METHODS : METHODS;
  set("#fMethodIn", el => {
    const last = inc ? ui.lastIncomeMethod : ui.lastMethod;
    const keep = methods.indexOf(el.value) !== -1 ? el.value : (methods.indexOf(last) !== -1 ? last : methods[0]);
    el.innerHTML = methods.map(m => '<option value="' + esc(m) + '">' + esc(m) + "</option>").join("");
    el.value = keep;
    syncReimbRow(inc ? "" : keep);
  });
  document.querySelectorAll("#entryType button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.etype === type)));
}

async function saveExpense(){
  const e = state.editingExpense;
  if (!e) return;
  const inc = e.type === "income";
  const L = LABELS[inc ? "income" : "expense"];
  const amount = Number($("#fAmount").value);
  const item = $("#fItem").value.trim();
  const err = $("#expErr");

  if (!(amount > 0)) { err.innerHTML = '<p class="err">Enter an amount greater than zero.</p>'; $("#fAmount").focus(); return; }
  if (!item) { err.innerHTML = '<p class="err">' + L.needItem + "</p>"; $("#fItem").focus(); return; }

  const pressed = $("#fPlanned button[aria-pressed='true']");
  const rec = Object.assign({}, e, {
    type: inc ? "income" : "expense",
    amount: Math.round(amount * 100) / 100,
    item,
    date: $("#fDate").value || todayISO(),
    category: $("#fCategory").value || (inc ? "Other income" : "Other"),
    vendor: $("#fVendor").value.trim(),
    paidBy: inc ? "" : $("#fPaidBy").value.trim(),
    method: $("#fMethodIn").value,
    planned: !!pressed && pressed.dataset.planned === "1",
    reimbursed: !inc && $("#fReimbursed").checked,
    notes: $("#fNotes").value.trim(),
    updatedAt: Date.now()
  });
  if (inc || rec.method !== REIMBURSABLE) { rec.reimbursed = false; delete rec.reimbursedOn; }

  const file = $("#fReceipt").files && $("#fReceipt").files[0];
  if (file) {
    try {
      err.innerHTML = '<p class="hint">Saving the photo…</p>';
      const small = await shrinkImage(file);
      const saved = await store.saveReceipt(small);
      rec.receipt = saved.ref;
    } catch (ex) {
      err.innerHTML = '<p class="err">' + esc(ex.message || "That photo did not save.") + " Nothing was saved.</p>";
      return;
    }
  }

  if (inc) {
    writeUI({ lastIncomeCat: rec.category, lastIncomeMethod: rec.method });
  } else {
    writeUI({ lastCat: rec.category, lastPerson: rec.paidBy, lastMethod: rec.method });
    if (rec.paidBy && (state.config.people || []).indexOf(rec.paidBy) === -1) {
      state.config.people = (state.config.people || []).concat([rec.paidBy]);
      store.putConfig().catch(() => {});
    }
  }

  try {
    await store.putExpense(rec.id, rec);
    closeSheet();
    toast((inc ? "+" : "") + money(rec.amount) + " logged");
  } catch (ex) {
    err.innerHTML = '<p class="err">' + esc(writeMsg(ex)) + "</p>";
  }
}

async function saveShow(){
  const s = state.editingShow;
  if (!s) return;
  const name = $("#sName").value.trim();
  const err = $("#showErr");
  if (!name) { err.innerHTML = '<p class="err">Give the production a name.</p>'; $("#sName").focus(); return; }

  const rec = Object.assign({}, s, {
    name,
    season: $("#sSeason").value.trim(),
    opensOn: $("#sOpens").value || "",
    budget: Math.round((Number($("#sBudget").value) || 0) * 100) / 100,
    incomeGoal: Math.round((Number($("#sGoal").value) || 0) * 100) / 100,
    archived: $("#sArchived").checked,
    categoryBudgets: s.categoryBudgets || {},
    incomeGoals: s.incomeGoals || {},
    updatedAt: Date.now()
  });

  try {
    await store.putShow(rec.id, rec);
    state.activeShowId = rec.id;
    writeUI({ activeShowId: rec.id });
    closeSheet();
    render();
  } catch (ex) {
    err.innerHTML = '<p class="err">' + esc(writeMsg(ex)) + "</p>";
  }
}

async function setIncomeGoal(name, value){
  const show = activeShow();
  if (!show) return;
  const g = Object.assign({}, show.incomeGoals || {});
  const v = Math.round((Number(value) || 0) * 100) / 100;
  if (v > 0) g[name] = v; else delete g[name];
  const rec = Object.assign({}, show, { incomeGoals: g, updatedAt: Date.now() });
  try { await store.putShow(show.id, rec); }
  catch (ex) { toast(writeMsg(ex)); }
}

function writeMsg(ex){
  const code = ex && ex.code;
  if (code === "invalid_argument") return "This view cannot change the shared data.";
  if (code === "quota_exceeded") return "The store is full. Delete some old records first.";
  if (code === "resource_exhausted") return "Too many changes at once. Give it a second and try again.";
  return "That did not save. Try again.";
}

async function setCategoryBudget(name, value){
  const show = activeShow();
  if (!show) return;
  const cb = Object.assign({}, show.categoryBudgets || {});
  const v = Math.round((Number(value) || 0) * 100) / 100;
  if (v > 0) cb[name] = v; else delete cb[name];
  const rec = Object.assign({}, show, { categoryBudgets: cb, updatedAt: Date.now() });
  try { await store.putShow(show.id, rec); }
  catch (ex) { toast(writeMsg(ex)); }
}

async function settlePerson(name, btn){
  const show = activeShow();
  if (!show) return;
  const items = showExpenses(show.id).filter(e =>
    !e.planned && e.method === REIMBURSABLE && !e.reimbursed &&
    ((e.paidBy || "").trim() || "Unnamed") === name);
  if (!items.length) return;
  const total = fromCents(sumC(items.map(i => cents(i.amount))));
  if (btn && !armed(btn, "Confirm " + money(total))) return;
  try {
    for (const it of items) {
      await store.putExpense(it.id, Object.assign({}, it, {
        reimbursed: true, reimbursedOn: todayISO(), updatedAt: Date.now()
      }));
    }
    toast(name + " marked reimbursed");
  } catch (ex) { toast(writeMsg(ex)); }
}

/* =========================================================
   CSV
   ========================================================= */
function csvCell(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csv(rows){
  return "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
async function offerFile(filename, text){
  let dl = null;
  try {
    if (window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads");
  } catch (e) { dl = null; }

  if (dl) {
    try {
      await dl.save({ filename, data: text });
      toast("Saved " + filename);
    } catch (ex) {
      const code = ex && ex.code;
      if (code === "declined") return;
      toast("That file did not save.");
    }
    return;
  }
  const blob = new Blob([text], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function slug(s){
  return String(s || "export").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "export";
}

function exportExpenses(){
  const show = activeShow(); if (!show) return;
  const list = sortExpenses(filterExpenses(showExpenses(show.id)));
  const rows = [["Production","Date","Type","Item","Vendor or source","Category","Amount","Actual cash",
    "Status","Paid by","Method","Reimbursed","Reimbursed on","Notes"]];
  for (const e of list) {
    const inc = isIncome(e);
    const amt = Number(e.amount) || 0;
    // the one column you can SUM for real cash movement: planned,
    // expected and in-kind entries stay blank
    const cash = (e.planned || (!inc && e.method === INKIND)) ? "" : (inc ? amt : -amt).toFixed(2);
    rows.push([
      show.name, e.date || "", inc ? "Income" : "Expense", e.item || "", e.vendor || "", e.category || "",
      amt.toFixed(2), cash,
      inc ? (e.planned ? "Expected" : "Received") : (e.planned ? "Planned" : "Paid"),
      inc ? "" : (e.paidBy || ""), e.method || "",
      (!inc && e.method === REIMBURSABLE) ? (e.reimbursed ? "Yes" : "No") : "",
      e.reimbursedOn || "", e.notes || ""
    ]);
  }
  const t = totals(list);
  const line = (label, v) => rows.push(["", "", "", label, "", "", v.toFixed(2)]);
  rows.push([]);
  line("Paid out", t.spent);
  line("Planned costs", t.planned);
  line("Income received", t.income);
  if (t.incomeExpected > 0) line("Income expected", t.incomeExpected);
  line("Net (received minus paid)", t.net);
  line("Projected net (with planned and expected)", t.projectedNet);
  if (t.inkind > 0) line("Donated in kind", t.inkind);
  offerFile(slug(show.name) + "-ledger.csv", csv(rows));
}

function exportSummary(){
  const show = activeShow(); if (!show) return;
  const list = showExpenses(show.id);
  const costs = list.filter(e => !isIncome(e));
  const income = list.filter(isIncome);

  const map = byCategory(costs);
  const budgets = show.categoryBudgets || {};
  const names = [...new Set([...state.config.categories, ...map.keys(), ...Object.keys(budgets)])];
  const rows = [["Cost category","Budget","Paid","Planned","Committed","Remaining","In kind"]];
  for (const n of names) {
    const items = map.get(n) || [];
    const t = totals(items);
    const b = Number(budgets[n]) || 0;
    if (!items.length && !b) continue;
    rows.push([n, b.toFixed(2), t.spent.toFixed(2), t.planned.toFixed(2),
      t.committed.toFixed(2), (b - t.committed).toFixed(2), t.inkind.toFixed(2)]);
  }
  const ct = totals(costs);
  const b = Number(show.budget) || 0;
  rows.push(["Total costs", b.toFixed(2), ct.spent.toFixed(2), ct.planned.toFixed(2),
    ct.committed.toFixed(2), (b - ct.committed).toFixed(2), ct.inkind.toFixed(2)]);

  rows.push([]);
  const imap = byCategory(income);
  const goals = show.incomeGoals || {};
  const inames = [...new Set([...DEFAULT_INCOME_CATEGORIES, ...imap.keys(), ...Object.keys(goals)])];
  rows.push(["Income category","Goal","Received","Expected","Total","Still to goal"]);
  for (const n of inames) {
    const items = imap.get(n) || [];
    const t = totals(items);
    const g = Number(goals[n]) || 0;
    if (!items.length && !g) continue;
    rows.push([n, g.toFixed(2), t.income.toFixed(2), t.incomeExpected.toFixed(2),
      t.incomeAll.toFixed(2), Math.max(0, g - t.incomeAll).toFixed(2)]);
  }
  const it = totals(income);
  const goal = incomeGoalFor(show);
  rows.push(["Total income", goal.toFixed(2), it.income.toFixed(2), it.incomeExpected.toFixed(2),
    it.incomeAll.toFixed(2), Math.max(0, goal - it.incomeAll).toFixed(2)]);

  const all = totals(list);
  rows.push([]);
  rows.push(["Net so far (received minus paid)", all.net.toFixed(2)]);
  rows.push(["Projected net (with planned and expected)", all.projectedNet.toFixed(2)]);
  offerFile(slug(show.name) + "-budget-summary.csv", csv(rows));
}

function exportOwed(){
  const show = activeShow(); if (!show) return;
  const people = owedByPerson(showExpenses(show.id));
  const rows = [["Person","Date","Item","Vendor","Category","Amount"]];
  for (const p of people) {
    for (const e of sortExpenses(p.items)) {
      rows.push([p.name, e.date || "", e.item || "", e.vendor || "", e.category || "",
        (Number(e.amount) || 0).toFixed(2)]);
    }
    rows.push(["", "", "Total for " + p.name, "", "", p.total.toFixed(2)]);
    rows.push([]);
  }
  offerFile(slug(show.name) + "-reimbursements.csv", csv(rows));
}

function paintShowPicker(){
  const sel = $("#showPick");
  const shows = [...state.shows.values()].sort((a, b) => {
    const ax = a.archived ? 1 : 0, bx = b.archived ? 1 : 0;
    if (ax !== bx) return ax - bx;
    return (b.opensOn || "").localeCompare(a.opensOn || "");
  });
  sel.innerHTML = shows.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === state.activeShowId ? " selected" : "") + ">" +
    esc(s.name) + (s.archived ? " (closed)" : "") + "</option>").join("") ||
    '<option value="">No productions</option>';
  sel.hidden = shows.length === 0;
}

function paintTabs(){
  const show = activeShow();
  const owed = show ? owedByPerson(showExpenses(show.id)) : [];
  const n = owed.length;
  const badge = $("#owedCnt");

  badge.textContent = String(n);
