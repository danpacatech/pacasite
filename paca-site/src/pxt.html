function paintStatus(){
  const el = $("#statusline");
  if (store.mode === "net") {
    el.innerHTML = net.key
      ? "Shared with everyone who has this link <b>and the passphrase</b>."
      : "<b>Shared with anyone who has this link.</b> No passphrase is set.";
    return;
  }
  if (store.mode === "db") {
    el.innerHTML = state.writable
      ? "Saved for everyone with access to this page."
      : "<b>Read only.</b> You can look and export, but not change anything.";
  } else {
    el.innerHTML = "<b>Saved in this browser only.</b> Export a CSV now and then so you have a copy.";
  }
}

function render(){
  if (!state.loaded) return;
  if (!state.activeShowId || !state.shows.has(state.activeShowId)) {
    const ui = readUI();
    const shows = [...state.shows.values()];
    const preferred = shows.find(s => s.id === ui.activeShowId) ||
      shows.filter(s => !s.archived).sort((a, b) => (b.opensOn || "").localeCompare(a.opensOn || ""))[0] ||
      shows[0];
    state.activeShowId = preferred ? preferred.id : null;
  }
  paintShowPicker();
  paintTabs();
  renderHero();
  renderViews();
  const fab = $("#fab");
  fab.hidden = !activeShow() || !state.writable;
  paintStatus();
}

function boot(){
  const ui = readUI();
  if (ui.activeShowId) state.activeShowId = ui.activeShowId;
  if (ui.theme) document.documentElement.setAttribute("data-theme", ui.theme);
  render();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("click", ev => {
  const tab = ev.target.closest(".tab");
  if (tab) { state.view = tab.dataset.view; render(); return; }

  const openRow = ev.target.closest("[data-open]");
  if (openRow) {
    const e = state.expenses.get(openRow.dataset.open);
    if (e) openSheet(expenseSheet(e));
    return;
  }

  const ft = ev.target.closest("[data-ftype]");
  if (ft) {
    state.filters.type = ft.dataset.ftype;
    document.querySelectorAll("[data-ftype]").forEach(b =>
      b.setAttribute("aria-pressed", String(b === ft)));
    refreshList();
    return;
  }

  const et = ev.target.closest("#entryType button");
  if (et) { applyEntryType(et.dataset.etype); return; }

  const seg = ev.target.closest("#fPlanned button");
  if (seg) {
    document.querySelectorAll("#fPlanned button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === seg)));
    return;
  }

  const act = ev.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;

  if (a === "close") { closeSheet(); return; }
  if (a === "new-expense") { if (activeShow()) openSheet(expenseSheet(null, "expense")); return; }
  if (a === "new-income") { if (activeShow()) openSheet(expenseSheet(null, "income")); return; }
  if (a === "save-expense") { saveExpense(); return; }
  if (a === "delete-expense") {
    const e = state.editingExpense;
    if (!e) return;
    if (!armed(act, "Tap again to delete")) return;
    store.delExpense(e.id).then(() => { closeSheet(); toast("Deleted"); })
      .catch(ex => toast(writeMsg(ex)));
    return;
  }
  if (a === "drop-receipt") {
    if (state.editingExpense) {
      state.editingExpense.receipt = null;
      const box = $("#receiptBox");
      const img = box && box.querySelector("img");
      if (img) img.remove();
      act.remove();
    }
    return;
  }
  if (a === "new-show") { openSheet(showSheet(null)); return; }
  if (a === "edit-show") {
    const id = act.dataset.show || state.activeShowId;
    const s = state.shows.get(id);
    if (s) openSheet(showSheet(s));
    return;
  }
  if (a === "save-show") { saveShow(); return; }
  if (a === "delete-show") {
    const s = state.editingShow;
    if (!s) return;
    const n = showExpenses(s.id).length;
    if (!armed(act, "Delete show and " + n + (n === 1 ? " entry" : " entries"))) return;
    store.delShow(s.id).then(() => {
      if (state.activeShowId === s.id) state.activeShowId = null;
      closeSheet(); render(); toast("Production deleted");
    }).catch(ex => toast(writeMsg(ex)));
    return;
  }
  if (a === "pick-show") {
    state.activeShowId = act.dataset.show;
    writeUI({ activeShowId: state.activeShowId });
    state.view = "expenses";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (a === "settle") { settlePerson(act.dataset.person, act); return; }
  if (a === "clear-filters") {
    state.filters = { q:"", cat:"", person:"", method:"", kind:"", type:"" };
    renderViews(); return;
  }
  if (a === "export-expenses") { exportExpenses(); return; }
  if (a === "export-summary") { exportSummary(); return; }
  if (a === "export-owed") { exportOwed(); return; }
  if (a === "print") { window.print(); return; }
});

// <details> toggle does not bubble, so listen on the way down
document.addEventListener("toggle", ev => {
  const d = ev.target;
  if (!d || !d.id) return;
  if (d.id === "budgetMore") state.open.budgetMore = d.open;
  if (d.id === "goalMore") state.open.goalMore = d.open;
}, true);

$("#scrim").addEventListener("click", ev => { if (ev.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#scrim").hidden) closeSheet();
});


$("#showPick").addEventListener("change", ev => {
  state.activeShowId = ev.target.value;
  writeUI({ activeShowId: state.activeShowId });
  render();
});

$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  writeUI({ theme: next });
  toast(next === "dark" ? "Dark" : next === "light" ? "Light" : "Matching your device");
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { state.filters.q = t.value; refreshList(); return; }
  if (t.id === "fMethodIn") { syncReimbRow(t.value); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "fCat") { state.filters.cat = t.value; refreshList(); return; }
  if (t.id === "fPerson") { state.filters.person = t.value; refreshList(); return; }
  if (t.id === "fMethod") { state.filters.method = t.value; refreshList(); return; }
  if (t.id === "fKind") { state.filters.kind = t.value; refreshList(); return; }
  if (t.id === "fMethodIn") { syncReimbRow(t.value); return; }
  if (t.dataset && t.dataset.budgetFor) { setCategoryBudget(t.dataset.budgetFor, t.value); return; }
  if (t.dataset && t.dataset.goalFor) { setIncomeGoal(t.dataset.goalFor, t.value); return; }
});

/* =========================================================
   Go
   ========================================================= */
state.loaded = false;
store.init().catch(err => {
  console.error(err);
  store.mode = "local";
  store.loadLocal();
  state.loaded = true;
  boot();
});
setTimeout(() => {
  if (state.loaded) return;
  if (store.mode !== "db") store.loadLocal();
  state.loaded = true;
  boot();
}, 11000);
</script>
</body>
</html>
